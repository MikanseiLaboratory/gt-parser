name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: CLI smoke
        run: |
          cargo run -p gt-cli --locked -- convert fixtures/synthetic/basic.gtxml -o /tmp/gt-out
          cargo run -p gt-cli --locked -- fields fixtures/synthetic/basic.gtxml
          cargo run -p gt-cli --locked -- schema
          cargo run -p gt-cli --locked -- pack fixtures/synthetic/basic.gtxml -o /tmp/gt-out/roundtrip.gtzip
