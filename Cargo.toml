[workspace]
resolver = "3"
members = ["crates/gt-core", "crates/gt-cli", "crates/gt-mcp", "crates/gt-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/MikanseiLaboratory/gt-parser"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
html-escape = "0.2.15"
pretty_assertions = "1.4.1"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
] }
uuid = { version = "1.18.1", features = ["v4"] }
zip = "8.6.0"
