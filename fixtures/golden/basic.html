<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GT Title</title>
<style>
html, body {
  margin: 0;
  background: transparent;
}
.gt-stage {
  position: relative;
  overflow: hidden;
  background: transparent;
}
.gt-layer, .gt-object {
  position: absolute;
  box-sizing: border-box;
}
.gt-text {
  display: flex;
  overflow: hidden;
}
.gt-shape {
  display: block;
  overflow: visible;
}
</style>
</head>
<body>
<div class="gt-stage" style="width:1920.000px;height:1080.000px;">
  <div class="gt-layer" data-gt-name="Layer 1" data-gt-type="Layer" style="left:0.000px;top:0.000px;width:1920.000px;height:1080.000px;">
    <svg class="gt-object gt-shape" data-gt-name="Rect 1" data-gt-type="Rectangle" style="left:0.000px;top:800.000px;width:1000.000px;height:100.000px;"><rect x="0" y="0" width="100%" height="100%" rx="0.000" ry="0.000" fill="#FF0000" stroke="none" stroke-width="0.000"/></svg>
    <svg class="gt-object gt-shape" data-gt-name="Circle 1" data-gt-type="Ellipse" style="left:40.000px;top:40.000px;width:120.000px;height:120.000px;"><ellipse cx="50%" cy="50%" rx="50%" ry="50%" fill="#00AAFF" stroke="none" stroke-width="0.000"/></svg>
    <svg class="gt-object gt-shape" data-gt-name="Tri 1" data-gt-type="Triangle" style="left:200.000px;top:40.000px;width:80.000px;height:80.000px;" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="50,0 100,100 0,100" fill="#FFFF00" stroke="none" stroke-width="0.000" vector-effect="non-scaling-stroke"/></svg>
    <div class="gt-object gt-text" data-gt-name="Text 1" data-gt-type="TextBlock" style="left:60.000px;top:800.000px;width:1860.000px;height:100.000px;font-family:&quot;Arial&quot;,sans-serif;font-size:48.000px;font-weight:700;justify-content:flex-start;align-items:center;white-space:nowrap;color:#FFFFFF;">HERE WE ARE</div>
  </div>
</div>
</body>
</html>
